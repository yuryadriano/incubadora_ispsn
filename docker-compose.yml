version: '3.9'
services:
  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO DA APLICAÇÃO PHP (Incubadora ISPSN)
  # Identico ao clinica.ispsn.app para compatibilidade total Coolify
  # ─────────────────────────────────────────────────────────────────
  app-php:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-imcubadora_ispsn}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-test123}
      DB_PASS: ${DB_PASSWORD:-test123}
    depends_on:
      mysql:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO DA BASE DE DADOS MYSQL
  # ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-imcubadora_ispsn}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-test123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-test123}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO PHPMYADMIN
  # ─────────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-test123}
      PMA_ABSOLUTE_URI: https://phpmyadmin-incubadora.ispsn.app/
      UPLOAD_LIMIT: 300M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
