version: '3.8'

services:
  # Serviço Web (PHP + Apache)
  web:
    build: .
    container_name: incubadora_web
    restart: always
    ports:
      - "87:80"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-evaristo_adriano}
      - DB_PASS=${DB_PASS:-Elma2025@}
      - DB_NAME=${DB_NAME:-imcubadora_ispsn}
    volumes:
      - incubadora_uploads:/var/www/html/uploads
      - incubadora_blog_img:/var/www/html/assets/img/blog
      - incubadora_galeria_img:/var/www/html/assets/img/galeria
    depends_on:
      db:
        condition: service_healthy
    networks:
      - incubadora_network

  # Serviço de Base de Dados (MariaDB)
  db:
    image: mariadb:10.11
    container_name: incubadora_db
    restart: always
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --innodb-flush-log-at-trx-commit=2
      --innodb-lock-wait-timeout=5
      --wait-timeout=60
      --interactive-timeout=60
      --max-connections=100
      --table-open-cache=400
      --query-cache-type=0
    environment:
      - MYSQL_DATABASE=${DB_NAME:-imcubadora_ispsn}
      - MYSQL_USER=${DB_USER:-evaristo_adriano}
      - MYSQL_PASSWORD=${DB_PASS:-Elma2025@}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-Elma2025@}
    volumes:
      - incubadora_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incubadora_network

  # Interface de Gestão da BD (phpMyAdmin Seguro — Login Obrigatório)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: incubadora_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - UPLOAD_LIMIT=64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - incubadora_network

networks:
  incubadora_network:
    driver: bridge

volumes:
  incubadora_db_data:
  incubadora_uploads:
  incubadora_blog_img:
  incubadora_galeria_img:
