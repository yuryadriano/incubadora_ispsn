version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO WEB PRINCIPAL (Incubadora ISPSN)
  # Serviço com nome 'web' correspondente às regras do Coolify
  # ─────────────────────────────────────────────────────────────────
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-imcubadora_ispsn}
      DB_USER: ${DB_USER:-incubadora_user}
      DB_PASS: ${DB_PASS:-incubadora_pass}
      DB_PASSWORD: ${DB_PASS:-incubadora_pass}
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO DA BASE DE DADOS (MySQL 8)
  # ─────────────────────────────────────────────────────────────────
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-imcubadora_ispsn}
      MYSQL_USER: ${DB_USER:-incubadora_user}
      MYSQL_PASSWORD: ${DB_PASS:-incubadora_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-incubadora_user}", "-p${DB_PASS:-incubadora_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  # SERVIÇO PHPMYADMIN
  # ─────────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-incubadora_user}
      PMA_PASSWORD: ${DB_PASS:-incubadora_pass}
      UPLOAD_LIMIT: 300M
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
